<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="../homepage.html" style="position: fixed; top: 20px; left: 20px; z-index: 20; text-decoration: none; color: #fff; background: rgba(15, 23, 42, 0.8); padding: 10px 14px; border-radius: 999px; backdrop-filter: blur(8px);">← Back</a>
    <main class="calculator-shell">
      <h1 class="calculator-title">Simple Calculator</h1>
      <section class="calculator-card" aria-label="Calculator">
        <div class="display">
          <div id="expression" class="expression">0</div>
          <div id="result" class="result">0</div>
        </div>

        <div class="buttons">
          <button class="btn control" data-action="clear">C</button>
          <button class="btn control" data-action="delete">DEL</button>
          <button class="btn operator" data-value="/">÷</button>
          <button class="btn operator" data-value="*">×</button>

          <button class="btn number" data-value="7">7</button>
          <button class="btn number" data-value="8">8</button>
          <button class="btn number" data-value="9">9</button>
          <button class="btn operator" data-value="-">−</button>

          <button class="btn number" data-value="4">4</button>
          <button class="btn number" data-value="5">5</button>
          <button class="btn number" data-value="6">6</button>
          <button class="btn operator" data-value="+">+</button>

          <button class="btn number" data-value="1">1</button>
          <button class="btn number" data-value="2">2</button>
          <button class="btn number" data-value="3">3</button>
          <button class="btn equals" data-action="equals">=</button>

          <button class="btn number zero" data-value="0">0</button>
          <button class="btn number" data-value=".">.</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
