<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha Projects</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%);
        color: #f8fafc;
      }

      .panel {
        width: min(900px, 100%);
        background: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        padding: 32px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        color: #e2e8f0;
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }

      .project-card {
        display: block;
        text-decoration: none;
        color: #fff;
        padding: 20px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.16);
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .project-card:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.24);
      }

      .project-title {
        display: block;
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .project-desc {
        display: block;
        font-size: 0.95rem;
        color: #dbeafe;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>CodeAlpha Front-End Collection</h1>
      <p>Explore three polished web projects in one place.</p>

      <div class="grid">
        <a class="project-card" href="codealpha_task_1_image-gallery/index.html">
          <span class="project-title">Task 1</span>
          <span class="project-desc">Creative image gallery</span>
        </a>

        <a class="project-card" href="codealpha_task_2_calculator/index.html">
          <span class="project-title">Task 2</span>
          <span class="project-desc">Interactive calculator</span>
        </a>

        <a class="project-card" href="codealpha_task_3_music-player/index.html">
          <span class="project-title">Task 3</span>
          <span class="project-desc">Modern music player</span>
        </a>
      </div>
    </div>
  </body>
</html>
