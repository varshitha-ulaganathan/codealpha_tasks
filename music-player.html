<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="music-player.css" />
  </head>
  <body>
    <main class="player-shell">
      <section class="player-card">
        <div class="player-main">
          <div class="player-panel">
            <div class="cover-wrap">
              <div class="cover"></div>
              <div class="orb orb-one"></div>
              <div class="orb orb-two"></div>
            </div>
            <div class="info">
              <p class="eyebrow">Now Playing</p>
              <h1 id="title">Midnight Glow</h1>
              <p id="artist">Luna Vale</p>
            </div>

            <div class="progress-wrap">
              <div class="time-row">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
              </div>
              <input id="progress" type="range" min="0" max="100" value="0" />
            </div>

            <div class="controls">
              <button id="prev" class="control-btn">⏮</button>
              <button id="playPause" class="play-btn">▶</button>
              <button id="next" class="control-btn">⏭</button>
            </div>

            <div class="volume-row">
              <span>🔊</span>
              <input id="volume" type="range" min="0" max="1" step="0.1" value="0.8" />
            </div>
          </div>

          <div class="playlist-panel">
            <div class="playlist-header">
              <h3>Playlist</h3>
              <span>8 tracks</span>
            </div>
            <ul id="playlist"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="music-player.js"></script>
  </body>
</html>
